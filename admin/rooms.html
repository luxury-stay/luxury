<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý phòng | Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <div class="admin-wrapper">
    <aside class="admin-sidebar">
      <div class="brand"><h4><i class="bi bi-building"></i> LUXURY STAY</h4><small style="color:rgba(255,255,255,0.5);">Admin Panel</small></div>
      <nav style="margin-top:12px;">
        <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="bookings.html"><i class="bi bi-calendar-check"></i> Quản lý đơn hàng</a>
        <a href="rooms.html" class="active"><i class="bi bi-door-open"></i> Quản lý phòng</a>
        <a href="users.html"><i class="bi bi-people"></i> Quản lý tài khoản</a>
        <a href="categories.html"><i class="bi bi-tags"></i> Quản lý danh mục</a>
        <hr style="border-color:rgba(255,255,255,0.1);margin:12px 16px;">
        <a href="../index.html"><i class="bi bi-box-arrow-left"></i> Về trang chủ</a>
        <a href="#" onclick="logout();return false;"><i class="bi bi-box-arrow-right"></i> Đăng xuất</a>
      </nav>
    </aside>
    <div class="admin-content">
      <div class="admin-topbar">
        <h5 style="margin:0;font-weight:700;">Quản lý phòng (Sản phẩm)</h5>
        <button class="btn btn-primary btn-sm" onclick="alert('Form thêm phòng (kết nối PHP)\\nMã phòng, Loại, Tầng, Sức chứa, Giá, Trạng thái')"><i class="bi bi-plus"></i> Thêm phòng</button>
      </div>
      <div class="admin-main">
        <div class="table-card">
          <table>
            <thead><tr><th>ID</th><th>Tên phòng</th><th>Loại</th><th>Sức chứa</th><th>Giá/đêm</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
            <tbody id="body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/main.js"></script>
  <script>
    if (!requireAuth(['staff','admin'])) throw '';
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('body').innerHTML = rooms.map(r => `
        <tr>
          <td><strong>#${r.id}</strong></td>
          <td>${r.name}</td>
          <td>${r.type}</td>
          <td>${r.capacity} người</td>
          <td>${formatPrice(r.price)}</td>
          <td>
            <select style="padding:4px 8px;border-radius:6px;border:1px solid #ddd;font-size:13px;" onchange="alert('Cập nhật trạng thái phòng #${r.id} → '+this.value)">
              <option value="available" ${r.status==='available'?'selected':''}>Trống</option>
              <option value="occupied">Đang dùng</option>
              <option value="maintenance">Bảo trì</option>
            </select>
          </td>
          <td>
            <button class="btn btn-outline btn-sm" onclick="alert('Sửa phòng #${r.id}')"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-danger btn-sm" onclick="if(confirm('Xóa phòng #${r.id}?'))alert('Đã xóa')"><i class="bi bi-trash"></i></button>
          </td>
        </tr>
      `).join('');
    });
  </script>
</body>
</html>
